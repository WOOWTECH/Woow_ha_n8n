name: CI

# Every pull request runs the repository tests, builds the amd64 add-on image
# the way the release does, and smoke-tests the container (health, watchdog,
# ingress in headless Chromium, JavaScript and Python Code nodes, secret
# handling). The publish workflow calls this before it pushes any image.
# A PR that changes the add-on version is also compared with the latest
# formal Release ("Upgrade comparison / compare", pipeline #89).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Repository tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install nginx and test dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nginx jq
          python -m pip install -r n8n/test/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run the repository tests
        run: bash n8n/test/run-tests.sh

  image:
    name: Build and smoke-test the amd64 image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install the browser for the ingress check
        run: |
          set -euo pipefail
          python -m pip install -r n8n/test/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Build the amd64 image
        run: |
          set -euo pipefail
          version="$(yq -r '.version' n8n/config.yaml)"
          docker build \
            --build-arg BUILD_ARCH=amd64 \
            --build-arg "BUILD_VERSION=${version}" \
            -t local/woow-n8n:ci \
            n8n

      # The SBOM of this image is what the Upgrade comparison scans as the
      # new version (pipeline #89, category 4): pinned Syft from the Store,
      # uploaded as artifact upgrade-comparison-sbom-woow-n8n.
      - name: SBOM for the upgrade comparison
        if: github.event_name == 'pull_request'
        uses: WOOWTECH/Woow_HA_App_Store/.github/actions/addon-sbom@main
        with:
          component: woow-n8n
          image: local/woow-n8n:ci

      - name: Smoke-test the container
        working-directory: n8n/test
        run: python smoke-container.py local/woow-n8n:ci --browser

  # Upgrade comparison (pipeline #89): a PR that bumps the add-on version is
  # compared with the latest formal Release. A breaking config.yaml change
  # not declared in n8n/upgrade-notes.yaml blocks it, and so does a new
  # fixable Critical/High vulnerability in the amd64 image (the SBOM from the
  # image job against the Release's GHCR image) unless that file accepts it.
  # No needs: on the build, so a PR that changes no version passes in
  # seconds; after a version bump the job waits for this run's SBOM artifact
  # (actions: read) and fails if the image job never uploads it. On push, and
  # when the publish workflow calls this file (its Validate job), the job
  # passes at once, so that workflow's non-PR run (registry
  # required_workflows) still succeeds. Reported as
  # "Upgrade comparison / compare". The PR build and the publish build both
  # run without a layer cache, so the SBOM is of what the Release ships.
  upgrade-comparison:
    name: Upgrade comparison
    permissions:
      contents: read
      actions: read
    uses: WOOWTECH/Woow_HA_App_Store/.github/workflows/woow-addon-upgrade-check.yml@main
    with:
      sbom_artifact: upgrade-comparison-sbom-*
