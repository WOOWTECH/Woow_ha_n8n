name: CI

# Every pull request runs the repository tests, builds the amd64 add-on image
# the way the release does, and smoke-tests the container (health, watchdog,
# ingress in headless Chromium, JavaScript and Python Code nodes, secret
# handling). The publish workflow calls this before it pushes any image.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Repository tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install nginx and test dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nginx jq
          python -m pip install -r n8n/test/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run the repository tests
        run: bash n8n/test/run-tests.sh

  image:
    name: Build and smoke-test the amd64 image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install the browser for the ingress check
        run: |
          set -euo pipefail
          python -m pip install -r n8n/test/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Build the amd64 image
        run: |
          set -euo pipefail
          version="$(yq -r '.version' n8n/config.yaml)"
          docker build \
            --build-arg BUILD_ARCH=amd64 \
            --build-arg "BUILD_VERSION=${version}" \
            -t local/woow-n8n:ci \
            n8n

      - name: Smoke-test the container
        working-directory: n8n/test
        run: python smoke-container.py local/woow-n8n:ci --browser
