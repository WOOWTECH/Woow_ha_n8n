name: Publish n8n add-on images

on:
  push:
    branches:
      - main
    paths:
      - n8n/config.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The same tests, build and container smoke test as every pull request.
  # actions: read is for ci.yml's Upgrade comparison job (a nested job only
  # gets permissions its caller job has); on push that job passes at once.
  validate:
    name: Validate
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish ${{ matrix.arch }} image
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - name: Check out the release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Read the add-on version
        id: addon
        shell: bash
        run: |
          version="$(awk -F': ' '$1 == "version" { print $2; exit }' n8n/config.yaml)"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "image=ghcr.io/woowtech/woow-ha-n8n-${{ matrix.arch }}:${version}" >> "${GITHUB_OUTPUT}"

      - name: Record image build date
        id: metadata
        shell: bash
        run: echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "${GITHUB_OUTPUT}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Published add-on images are immutable: Supervisor installs and
      # restores backups by tag, so a tag must never change content. A tag
      # that already exists is only accepted when it was built from this
      # same commit (completing a partially published release); otherwise
      # the run fails and the fix is a new add-on version.
      - name: Refuse to overwrite a published tag
        id: tag
        shell: bash
        env:
          IMAGE: ${{ steps.addon.outputs.image }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          if output="$(docker buildx imagetools inspect --format '{{json .Image}}' "${IMAGE}" 2>&1)"; then
            # Single image config or a per-platform map (with attestations).
            published="$(jq -r '[.. | objects | select(has("Labels")) | (.Labels // {})["org.opencontainers.image.revision"] // empty] | first // ""' <<<"${output}")"
            if [ "${published}" = "${REVISION}" ]; then
              echo "::notice title=Already published::${IMAGE} was already built from ${REVISION}; not rebuilding it."
              echo "exists=true" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            echo "::error title=Tag already published::${IMAGE} already exists (revision '${published}'). Published images are never overwritten; bump the version in n8n/config.yaml instead."
            exit 1
          fi
          if grep -qiE 'not found|manifest unknown|name unknown' <<<"${output}"; then
            echo "exists=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "::error title=Registry check failed::Could not tell whether ${IMAGE} exists: ${output}"
          exit 1

      - name: Set up QEMU
        if: steps.tag.outputs.exists != 'true'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        if: steps.tag.outputs.exists != 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push image
        if: steps.tag.outputs.exists != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./n8n
          file: ./n8n/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/woowtech/woow-ha-n8n-${{ matrix.arch }}:${{ steps.addon.outputs.version }}
          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.addon.outputs.version }}
            BUILD_DATE=${{ steps.metadata.outputs.created }}
            BUILD_DESCRIPTION=Flexible AI workflow automation (HTTP for LAN, use Cloudflare Tunnel for HTTPS)
            BUILD_NAME=Woow n8n
            BUILD_REF=${{ github.sha }}
            BUILD_REPOSITORY=${{ github.repository }}

  # The App Store ships only published Releases (registry ref_policy: release).
  # After the checks above pass on main, the Store's shared workflow publishes
  # the Release for a config.yaml version that has none yet.
  release:
    name: Release
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: WOOWTECH/Woow_HA_App_Store/.github/workflows/woow-addon-release.yml@main
